[package]
name = "melee-dat"
version = "0.2.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["melee", "ssbm", "gamecube", "hsd", "animation"]
categories = ["game-development"]
description = "Super Smash Bros. Melee on top of dat-parser: fighters, stages, their animations, and the vanilla file table"

[features]
# Tests that read a clean Melee disc image named by TGG_MELEE_ISO; CI
# compiles them.
melee-iso = []

[dependencies]
dat-parser = { version = "0.2.0", path = "../dat-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
# The vanilla_files example and the melee-iso tests read a disc image.
gc-iso = { version = "0.2.0", path = "../gc-iso" }
tempfile = "3"

[lints]
workspace = true
