[package]
name = "tgg-app"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "What the textures.gg app does, with no UI: the player's game, the library, installs and settings"
publish = false

[features]
# The hand-written test model, for the app's own flow tests.
test-support = []

[dependencies]
dat-edit = { path = "../dat-edit" }
dat-parser = { path = "../dat-parser" }
melee-dat = { path = "../melee-dat" }
# Reading costumes and references from the player's ISO, and installing.
gc-iso = { path = "../gc-iso" }
# Where settings, the library and logs live.
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading a replay's frames for its stats.
peppi = "2.1"
# Skins are kept by content hash.
sha2 = "0.10"
thiserror = "2"
# The update check, and sending a problem report the player chose to send.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Skins added as zip archives.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
