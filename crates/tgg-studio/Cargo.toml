[package]
name = "tgg-studio"
version = "0.3.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The textures.gg desktop app, on Rune"
publish = false

[features]
# Tests that read a clean Melee disc image named by TGG_MELEE_ISO.
melee-iso = []

[dependencies]
tgg-app = { path = "../tgg-app" }
dat-edit = { path = "../dat-edit" }
dat-parser = { path = "../dat-parser" }
hsd-render = { path = "../hsd-render", default-features = false }
melee-dat = { path = "../melee-dat" }
# tgg-melee and its mods from textures.gg: installing, planning, launching.
tgg-mod = { path = "../tgg-mod" }
# Signing in to textures.gg, shared with the tgg CLI.
tgg-account = { path = "../tgg-account" }
# Where costume renders are kept.
dirs = "5"
# Costume renders are kept as PNGs, by their file's SHA-256.
# Pictures from textures.gg: pack thumbnails are WebP, avatars JPEG or PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
# A sent report's answer.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same wgpu Rune and hsd-render draw with: the viewport shares their device.
wgpu = "30.0.1"

# Pre-release: pin a `dev` rev, which is never rewritten, and move it on
# deliberately. Off: the Metal backend (macOS gets its own pass), ogg audio
# and SVG images, which the app doesn't use.
[dependencies.rune]
git = "https://github.com/anomalyco/rune"
rev = "8ee30954add065098f043335ece9d9ea0914d21d"
default-features = false
# The system's file dialog (on Linux, the portal over D-Bus), accessibility,
# and Inter as the fallback for glyphs the bundled faces lack.
features = ["accessibility", "dbus", "embedded-fonts", "native-file-dialog"]

[dev-dependencies]
tgg-app = { path = "../tgg-app", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

[build-dependencies]
# The icon and version details in tgg-studio.exe, on Windows (build.rs).
winresource = "0.1.34"
