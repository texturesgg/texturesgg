[package]
name = "tgg-mod"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["melee", "modding", "mod-loader"]
categories = ["game-development"]
description = "Mod packages for tgg-mod-runtime: manifests, declared hooks, catalogs, and installing into a port"

[features]
default = ["cli"]
# The `tgg-mod` tool. Hosts that embed the library (the editor) turn it off.
cli = ["dep:anyhow", "dep:clap"]

[[bin]]
name = "tgg-mod"
path = "src/bin/tgg-mod.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
# Reading the hooks a mod's library declares, and a port's runtime section.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Hand-built ELF objects stand in for compiled mods.
object = { version = "0.37", default-features = false, features = ["write_core", "elf", "std"] }
tempfile = "3"

[lints]
workspace = true
