[package]
name = "tgg-mod"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["melee", "modding", "mod-loader"]
categories = ["game-development"]
description = "Mod packages for tgg-melee: manifests, declared hooks, catalogs, and installing into the game"

[dependencies]
# Reading the records a mod's library carries, the game's tgg_port section,
# and the symbols a library links against: ELF on Linux, PE on Windows,
# Mach-O on macOS. Unaligned: a Mach-O file's load commands needn't sit at
# the alignment its 64-bit fields have.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "pe", "coff", "macho", "std", "unaligned"] }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Unpacking tgg-melee releases.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The registry and the release mirror.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Hand-built ELF objects stand in for compiled mods.
object = { version = "0.37", default-features = false, features = ["write_core", "elf", "std"] }
tempfile = "3"

[lints]
workspace = true
