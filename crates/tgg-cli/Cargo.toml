[package]
name = "tgg-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["melee", "modding", "cli"]
categories = ["command-line-utilities", "game-development"]
description = "The textures.gg command line: install tgg-melee, and build, publish and install its code mods"
publish = false

[[bin]]
name = "tgg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tgg-mod = { path = "../tgg-mod" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
