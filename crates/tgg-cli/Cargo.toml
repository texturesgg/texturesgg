[package]
name = "tgg-cli"
version = "0.2.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["melee", "modding", "cli"]
categories = ["command-line-utilities", "game-development"]
description = "The textures.gg command line: install tgg-melee, and build, publish and install its code mods"
publish = false

[[bin]]
name = "tgg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
dirs = "5"
# Unpacking tgg-melee releases, and checking them against their release.json.
flate2 = "1"
open = "5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tgg-mod = { path = "../tgg-mod" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
