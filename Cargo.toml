[workspace.package]
license = "GPL-3.0-or-later"
authors = ["Saavylab LLC <jayson@saavylab.com>"]
repository = "https://github.com/texturesgg/texturesgg"

[workspace]
members = [
  "crates/hal-dat-raw",
  "crates/gx-texture",
  "crates/gc-iso",
  "crates/dat-parser",
  "crates/melee-dat",
  "crates/dat-edit",
  "crates/hsd-render",
  "crates/tgg-mod",
  "crates/tgg-account",
  "crates/tgg-cli",
  "crates/tgg-app",
  "crates/tgg-studio",
]
resolver = "2"

# No crate here needs `unsafe`; the parsers read untrusted files.
[workspace.lints.rust]
unsafe_code = "forbid"

# Rune's own fixes to crates it uses (its root Cargo.toml says what each
# fixes). Cargo doesn't inherit a dependency's patches, so an app that builds
# Rune repeats them, at the same rev as `rune` in crates/tgg-studio.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
