name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Install the app's Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # These tests read a Melee disc image, which CI does not have. Compile
      # them so a change cannot silently break them.
      - name: Lint the melee-iso tests
        run: |
          cargo clippy --locked -p melee-dat --features melee-iso --all-targets -- -D warnings
          cargo clippy --locked -p tgg-studio --features melee-iso --all-targets -- -D warnings

      # The textures.gg site runs the renderer and the crates beneath it in
      # the browser; keep them building for wasm.
      - name: Lint for wasm
        run: cargo clippy --locked -p hsd-render -p melee-dat -p dat-edit --no-default-features --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  # tgg-studio ships for macOS and Windows too: the app and the crates under
  # it build, lint and pass their tests there. (tgg-editor, which tgg-studio
  # replaces, is Linux only.)
  rust-other:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: blacksmith-6vcpu-macos-15
          - name: Windows
            runs-on: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --workspace --exclude tgg-editor --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --exclude tgg-editor
