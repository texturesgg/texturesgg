name: CLI release

# A tag `cli-v<version>` (the version in crates/tgg-cli/Cargo.toml) builds
# `tgg` for Linux, macOS and Windows, publishes a GitHub release with the
# archives, SHA256SUMS, and a build provenance attestation for each archive,
# mirrors the durable archives to R2 (vgskins-assets/cli/<version>/), and
# points the install scripts at it (cli/latest.json). A pull request that
# changes the packaging builds every archive, unsigned, without publishing.
#
# Secrets, in the `release` environment (shared with the app's release):
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    tags: ["cli-v*"]
  pull_request:
    paths:
      - scripts/package-cli.sh
      - scripts/notices.py
      - .github/workflows/cli-release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_STAGE: _ci/cli-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  linux:
    name: Linux (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404
          - target: aarch64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
      # ring compiles C, which a static musl build needs musl's compiler for.
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y -qq musl-tools jq
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - run: scripts/package-cli.sh ${{ matrix.target }}

      - name: The binary is static and runs
        run: |
          file target/${{ matrix.target }}/release/tgg | grep -Eq "statically linked|static-pie linked"
          target/${{ matrix.target }}/release/tgg --version

      - name: Stage archive in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/${{ matrix.target }}.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  macos:
    name: macOS (universal)
    runs-on: blacksmith-6vcpu-macos-15
    # The `release` environment, and its signing secrets, only admit release tags.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "the certificate holds no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Set up notarization
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          printf '%s' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: A release is signed and notarized
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ -n "${CODESIGN_IDENTITY:-}" ] && [ -n "${NOTARY_KEY_PATH:-}" ] ||
            { echo "a release needs the signing and notarization secrets"; exit 1; }

      - run: scripts/package-cli.sh universal-apple-darwin

      - name: Stage archive in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/universal-apple-darwin.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  windows:
    name: Windows
    runs-on: blacksmith-4vcpu-windows-2025
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - run: scripts/package-cli.sh x86_64-pc-windows-msvc

      - name: Stage archive in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/x86_64-pc-windows-msvc.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch staged archives from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          mkdir -p packages
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl universal-apple-darwin x86_64-pc-windows-msvc; do
            npx --yes wrangler@4.146.0 r2 object get "vgskins-assets/$CI_STAGE/$target.tar" \
              --file "$target.tar" --remote
            tar -xf "$target.tar" -C packages
          done

      - name: Write SHA256SUMS
        working-directory: packages
        run: sha256sum tgg-* >SHA256SUMS

      # `gh attestation verify <archive> --repo texturesgg/texturesgg` checks
      # an archive was built here, from this tag.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/tgg-*

      # Not marked latest: the app's releases keep that.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
              --title "tgg ${GITHUB_REF_NAME#cli-v}" --generate-notes --latest=false
          fi

      # Mirror durable CLI files to R2, then point the install scripts at this version.
      - name: Mirror release files and point install scripts at it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          v="${GITHUB_REF_NAME#cli-v}"
          for f in packages/tgg-*.tar.gz; do
            npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/cli/$v/$(basename "$f")" \
              --file "$f" --content-type application/gzip \
              --cache-control "public, max-age=31536000, immutable" --remote
          done
          for f in packages/tgg-*.zip; do
            npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/cli/$v/$(basename "$f")" \
              --file "$f" --content-type application/zip \
              --cache-control "public, max-age=31536000, immutable" --remote
          done
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/cli/$v/SHA256SUMS" \
            --file packages/SHA256SUMS --content-type text/plain \
            --cache-control "public, max-age=31536000, immutable" --remote
          jq -n --arg version "$v" '{version: $version}' >latest.json
          npx --yes wrangler@4.146.0 r2 object put vgskins-assets/cli/latest.json \
            --file latest.json --content-type application/json \
            --cache-control "public, max-age=300" --remote

  cleanup:
    name: Clean up staging
    needs: [linux, macos, windows, publish]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - name: Remove temporary R2 staging objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl universal-apple-darwin x86_64-pc-windows-msvc; do
            npx --yes wrangler@4.146.0 r2 object delete "vgskins-assets/$CI_STAGE/$target.tar" --remote || true
          done
