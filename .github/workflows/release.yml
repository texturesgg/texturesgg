name: Release

# A tag `app-v<version>` (the version in crates/tgg-studio/Cargo.toml)
# builds the app for macOS, Linux and Windows, publishes a GitHub release
# with all three, mirrors the durable packages to R2 (vgskins-assets/studio/<version>/),
# and points the app's update check and textures.gg's download page at it
# (studio/latest.json, scripts/studio-latest.sh). A pull request that changes
# the packaging builds the packages, unsigned, without publishing.
#
# Secrets, in the `release` environment:
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD
#     the "Developer ID Application" certificate and key, as base64 .p12
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#     an App Store Connect API key for notarization
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#     write access to the R2 bucket behind assets.textures.gg

on:
  push:
    tags: ["app-v*"]
  pull_request:
    paths:
      - dist/**
      - scripts/package-*.sh
      - scripts/notices.py
      - scripts/studio-latest.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_STAGE: _ci/app-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  linux:
    name: Linux package
    # The oldest supported runner, so the binary needs only an older glibc.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the app's Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake jq

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - run: scripts/package-linux.sh

      - name: Stage package in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/linux.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  macos:
    name: macOS package
    runs-on: blacksmith-6vcpu-macos-15
    # The `release` environment, and its signing secrets, only admit app-v tags.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "the certificate holds no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Set up notarization
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          printf '%s' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: A release is signed and notarized
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ -n "${CODESIGN_IDENTITY:-}" ] && [ -n "${NOTARY_KEY_PATH:-}" ] ||
            { echo "a release needs the signing and notarization secrets"; exit 1; }

      - run: scripts/package-macos.sh

      - name: Stage package in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/macos.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  windows:
    name: Windows package
    runs-on: blacksmith-4vcpu-windows-2025
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    defaults:
      run:
        shell: bash
    # Unsigned until Saavylab's Windows signing is set up; then WINDOWS_SIGN
    # (see scripts/package-windows.sh) signs the app and the installer.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - run: scripts/package-windows.sh

      - name: Stage package in R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -cf pkg.tar -C target/package .
          npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/$CI_STAGE/windows.tar" \
            --file pkg.tar --content-type application/x-tar --cache-control "no-store" --remote

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: write
    steps:
      # For scripts/studio-latest.sh.
      - uses: actions/checkout@v7

      - name: Fetch staged packages from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          mkdir -p packages
          for plat in linux macos windows; do
            npx --yes wrangler@4.146.0 r2 object get "vgskins-assets/$CI_STAGE/$plat.tar" \
              --file "$plat.tar" --remote
            tar -xf "$plat.tar" -C packages
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run finds the release already made and replaces its files.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
              --title "textures.gg ${GITHUB_REF_NAME#app-v}" --generate-notes
          fi

      # Mirror durable packages to R2, then update studio/latest.json last so
      # neither the app nor the download page hears of a version whose files
      # aren't up yet.
      - name: Mirror packages and point the update check and download page at it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          v="${GITHUB_REF_NAME#app-v}"
          shopt -s nullglob
          for f in packages/*; do
            case "$f" in
              *.tar.gz) ct=application/gzip ;;
              *.zip) ct=application/zip ;;
              *.dmg) ct=application/x-apple-diskimage ;;
              *.exe) ct=application/vnd.microsoft.portable-executable ;;
              *) ct=application/octet-stream ;;
            esac
            npx --yes wrangler@4.146.0 r2 object put "vgskins-assets/studio/$v/$(basename "$f")" \
              --file "$f" --content-type "$ct" \
              --cache-control "public, max-age=31536000, immutable" --remote
          done
          scripts/studio-latest.sh packages "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" >latest.json
          cat latest.json
          npx --yes wrangler@4.146.0 r2 object put vgskins-assets/studio/latest.json \
            --file latest.json --content-type application/json \
            --cache-control "public, max-age=300" --remote

  cleanup:
    name: Clean up staging
    needs: [linux, macos, windows, publish]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - name: Remove temporary R2 staging objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for plat in linux macos windows; do
            npx --yes wrangler@4.146.0 r2 object delete "vgskins-assets/$CI_STAGE/$plat.tar" --remote || true
          done
