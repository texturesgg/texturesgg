[package]
name = "tgg-next"
version = "0.0.0"
edition = "2024"
publish = false
description = "Proof of concept: the textures.gg editor on Rune, drawing hsd-render's fighter on Rune's own GPU device"

# Its own workspace: Rune pins wgpu 30 while tgg-editor still pins 29, and
# the spike shouldn't touch the core workspace's lockfile.
[workspace]

[dependencies]
# Pre-release; pin a `dev` rev, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "8ee30954add065098f043335ece9d9ea0914d21d" }
# The same wgpu Rune draws with, so the renderer shares its device.
wgpu = "30.0.1"
bytemuck = { version = "1", features = ["derive"] }
dat-parser = { path = "../../../crates/dat-parser" }
gc-iso = { path = "../../../crates/gc-iso" }
hsd-render = { path = "../../../crates/hsd-render", default-features = false }
melee-dat = { path = "../../../crates/melee-dat" }

[profile.dev.package."*"]
opt-level = 2
