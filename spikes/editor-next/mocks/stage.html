        <div class="drop-hint"><svg class="ico"><use href="#i-in"/></svg>Drop .dat files or .zip archives anywhere to add them</div>

            <div class="seg" id="mod-tabs">
              <button data-tab="discover" class="on">Discover</button>
              <button data-tab="installed">Installed <span class="mono">4</span></button>
              <button data-tab="updates">Updates <span class="mono dotted">1</span></button>
            </div>
          </div>
          <div id="mods-body"></div>
        </div>
        <aside class="drawer glass" id="mod-drawer"></aside>
      </div>
    </section>

      <canvas class="stage-canvas full" id="edit-canvas"></canvas>

        <button class="btn ghost sm"><svg class="ico"><use href="#i-out"/></svg>Export</button>
        <span class="vsep"></span>
        <button class="btn ghost sm">Save</button>
        <button class="btn primary sm">Save and install</button>

      <aside class="pane right glass" id="color-pane"></aside>
